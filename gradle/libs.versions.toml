# Version catalog of the core-services SDK (`libs` of this build). Used by library/ and by build-logic/
# (the `app.core.services` Gradle plugin, which registers it under the same name in its own build).

[versions]
# Build toolchain. When the SDK is included from source (submodule, `includeBuild`), AGP must equal the
# consumer's AGP: Android does not allow two AGP versions in one build.
agp = "9.3.1"
kotlin = "2.3.21"
ksp = "2.3.7"
mavenPublish = "0.37.0"

amplitudeAnalytics = "1.37.2"
amplitudeExperiment = "1.16.1"
# Amplitude Session Replay: the runtime the SDK compiles against AND the Gradle plugin that
# `app.core.services` applies in the app module. One version for both: the plugin aligns every
# Session Replay artifact in the app to it.
amplitudeSessionReplay = "1.2.0"
appsflyer = "7.0.1"
ageSignals = "0.0.3"
appUpdate = "2.1.0"
billing = "9.1.0"
composeUi = "1.11.2"
coroutines = "1.11.0"
datastore = "1.2.1"
firebaseBom = "34.16.0"
firebaseCrashlyticsBuildtools = "3.0.7"
fragment = "1.8.9"
installReferrer = "2.2"
junit = "4.13.2"
ktor = "3.5.1"
lifecycle = "2.10.0"
okhttpLoggingInterceptor = "5.4.0"
playServicesAdsIdentifier = "18.3.0"
playServicesAppset = "16.1.0"
room = "2.8.4"
serializationJson = "1.11.0"
timber = "5.0.1"

[libraries]
# Core
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "appUpdate" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Compose
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }

# Lifecycle
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Billing
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }

# DataStore
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Google Play Services
play-services-ads-identifier = { module = "com.google.android.gms:play-services-ads-identifier", version.ref = "playServicesAdsIdentifier" }
play-services-appset = { module = "com.google.android.gms:play-services-appset", version.ref = "playServicesAppset" }
play-age-signals = { module = "com.google.android.play:age-signals", version.ref = "ageSignals" }

# Analytics
amplitude-analytics-android = { module = "com.amplitude:analytics-android", version.ref = "amplitudeAnalytics" }
amplitude-experiment-android = { module = "com.amplitude:experiment-android-client", version.ref = "amplitudeExperiment" }
amplitude-session-replay-plugin = { module = "com.amplitude:plugin-session-replay-android", version.ref = "amplitudeSessionReplay" }
appsflyer-android-sdk = { module = "com.appsflyer:af-android-sdk", version.ref = "appsflyer" }

# Database
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

# Install Referrer
install-referrer = { module = "com.android.installreferrer:installreferrer", version.ref = "installReferrer" }

# Logging
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
firebase-crashlytics-buildtools = { module = "com.google.firebase:firebase-crashlytics-buildtools", version.ref = "firebaseCrashlyticsBuildtools" }

# Network
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttpLoggingInterceptor" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }

# build-logic: implementation of the `com.amplitude.session-replay` Gradle plugin
amplitude-session-replay-gradle-plugin = { module = "com.amplitude:session-replay-gradle-plugin", version.ref = "amplitudeSessionReplay" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
